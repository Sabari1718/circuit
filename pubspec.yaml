name: sva_business_user
description: "SVA Business User"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.5.2
  local_auth: ^2.3.0
  file_picker: ^8.0.7
  intl: ^0.19.0
  pdf: ^3.12.0
  printing: ^5.14.3
  syncfusion_flutter_pdfviewer: ^27.2.5
  reorderable_grid_view: ^2.2.8
  flutter_image_compress: ^2.4.0

  # APP SECURITY CHECK
  package_info_plus: ^8.0.0
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/captcha/